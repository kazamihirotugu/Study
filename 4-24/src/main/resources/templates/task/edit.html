<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<h2>タスク入力</h2>

<form th:action="@{/task/edit}" th:object="${taskForm}" method="post">
<input type="hidden" th:field="*{taskId}" />
名前：<input type="text" th:field="*{taskName}" /><br>
状態：<input type="text" th:field="*{taskStatus}" /><br>
<button type="submit">保存</button>
</form>

</body>
</html>
